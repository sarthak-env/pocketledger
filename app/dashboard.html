<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – PocketLedger</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body { background: var(--bg); min-height: 100vh; }

    .expense-row {
      display: flex; align-items: center;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      transition: background 0.15s;
      gap: 10px;
    }
    .expense-row:hover { background: rgba(128,128,128,0.05); }

    .del-actions { display: none; gap: 6px; align-items: center; flex-shrink: 0; }
    .del-actions.show { display: flex; }

    .prog-ok   { background: var(--accent-green); }
    .prog-warn { background: var(--accent-orange); }
    .prog-over { background: var(--accent-red); }

    /* currency prefix updates dynamically */
    .amount-wrap { position: relative; }
    .amount-wrap .cur-prefix {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary); font-weight: 600;
      font-size: 14px; pointer-events: none;
      user-select: none;
    }
    .amount-wrap input { padding-left: 28px; }

    /* note text safely clipped */
    .exp-note { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>

<!-- ── Nav ── -->
<header class="glass-nav">
  <div style="max-width:740px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;">
    <a href="index.html" style="font-size:17px;font-weight:700;color:var(--text-primary);text-decoration:none;">💰 PocketLedger</a>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="track-badge" class="badge badge-green">On Track</span>
      <a href="settings.html" class="btn btn-ghost btn-sm" style="font-size:12px;">⚙️ Settings</a>
    </div>
  </div>
</header>

<main style="max-width:740px;margin:auto;padding:20px 20px 60px;">

  <!-- ── Summary Cards ── -->
  <section class="grid-3" style="margin-bottom:20px;">
    <div class="card card-hover" style="padding:16px;">
      <div style="font-size:10px;font-weight:600;color:var(--text-tertiary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;">Total Spent</div>
      <div id="total-spent" style="font-size:20px;font-weight:700;color:var(--text-primary);">—</div>
    </div>
    <div class="card card-hover" style="padding:16px;">
      <div style="font-size:10px;font-weight:600;color:var(--text-tertiary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;">Budget Left</div>
      <div id="budget-left" style="font-size:20px;font-weight:700;color:var(--accent-green);">—</div>
    </div>
    <div class="card card-hover" style="padding:16px;">
      <div style="font-size:10px;font-weight:600;color:var(--text-tertiary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;">Top Category</div>
      <div id="top-category" style="font-size:16px;font-weight:700;">—</div>
    </div>
  </section>

  <!-- ── Budget Progress ── -->
  <section class="card" style="padding:18px 20px;margin-bottom:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span style="font-size:12px;font-weight:600;color:var(--text-secondary);">Monthly Budget</span>
      <span id="budget-pct" style="font-size:12px;font-weight:600;color:var(--text-secondary);">0% used</span>
    </div>
    <div class="progress-track">
      <div id="budget-bar" class="progress-fill prog-ok" style="width:0%;"></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;">
      <span id="budget-spent-label" style="font-size:11px;color:var(--text-tertiary);">—</span>
      <span id="budget-total-label" style="font-size:11px;color:var(--text-tertiary);">—</span>
    </div>
  </section>

  <!-- ── Add Expense ── -->
  <section class="card" style="padding:20px;margin-bottom:20px;">
    <h2 style="font-size:12px;font-weight:600;color:var(--text-secondary);margin:0 0 16px;text-transform:uppercase;letter-spacing:.5px;">New Expense</h2>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;">

      <div style="flex:1;min-width:110px;">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--text-tertiary);margin-bottom:6px;">Amount</label>
        <div class="amount-wrap">
          <span id="cur-prefix" class="cur-prefix">$</span>
          <input id="inp-amount" type="number" min="0.01" step="0.01" placeholder="0.00" class="input">
        </div>
      </div>

      <div style="flex:1;min-width:130px;">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--text-tertiary);margin-bottom:6px;">Category</label>
        <select id="inp-category" class="input" style="cursor:pointer;">
          <option value="Food">🍔 Food</option>
          <option value="Transport">🚗 Transport</option>
          <option value="Shopping">🛍️ Shopping</option>
          <option value="Entertainment">🎬 Entertainment</option>
          <option value="Bills">📄 Bills</option>
          <option value="Health">💊 Health</option>
          <option value="Other">📌 Other</option>
        </select>
      </div>

      <div style="min-width:140px;">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--text-tertiary);margin-bottom:6px;">Date</label>
        <input id="inp-date" type="date" class="input">
      </div>

      <div style="min-width:130px;">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--text-tertiary);margin-bottom:6px;">Note (optional)</label>
        <input id="inp-note" type="text" maxlength="80" placeholder="e.g. Lunch" class="input">
      </div>

      <button id="add-btn" class="btn btn-primary" style="padding:10px 22px;white-space:nowrap;">+ Add</button>
    </div>
    <p id="form-error" style="color:var(--accent-red);font-size:12px;font-weight:500;margin:8px 0 0;display:none;"></p>
  </section>

  <!-- ── Chart + Insights ── -->
  <div class="grid-2" style="margin-bottom:20px;">

    <!-- Pie chart -->
    <div class="card" style="padding:20px;">
      <h2 style="font-size:12px;font-weight:600;color:var(--text-secondary);margin:0 0 14px;text-transform:uppercase;letter-spacing:.5px;">Breakdown</h2>
      <div id="chart-area" style="display:flex;flex-direction:column;align-items:center;">
        <svg id="pie-chart" viewBox="0 0 100 100" width="150" height="150"></svg>
        <div id="chart-legend" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:11px;font-weight:500;"></div>
        <p id="chart-empty" style="font-size:12px;color:var(--text-tertiary);text-align:center;padding:20px 0 8px;margin:0;">Add expenses to see breakdown</p>
      </div>
    </div>

    <!-- Insights -->
    <div class="card" style="padding:20px;">
      <h2 style="font-size:12px;font-weight:600;color:var(--text-secondary);margin:0 0 14px;text-transform:uppercase;letter-spacing:.5px;">Insights</h2>
      <div id="insights-list">
        <p style="font-size:12px;color:var(--text-tertiary);">No insights yet. Start adding expenses.</p>
      </div>
    </div>

  </div>

  <!-- ── Expense List ── -->
  <section class="card" style="overflow:hidden;">
    <div style="padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between;">
      <h2 style="font-size:12px;font-weight:600;color:var(--text-secondary);margin:0;text-transform:uppercase;letter-spacing:.5px;">Recent Expenses</h2>
      <span id="expense-count" class="badge badge-gray">0</span>
    </div>
    <div id="expense-list"></div>
    <p id="empty-state" style="text-align:center;font-size:12px;color:var(--text-tertiary);padding:32px;margin:0;">No expenses yet — add one above!</p>
  </section>

</main>

<div id="toast" class="toast"></div>

<script type="module">
import {
  getExpenses, addExpense, deleteExpense,
  getSettings, fmt, formatDate, escapeHtml, calcStats,
  CATEGORY_META, CURRENCY_SYMBOLS, applyDarkMode
} from '../js/store.js';
import { showToast } from '../js/toast.js';

// ── Boot: apply persisted dark mode immediately ────────────────────────────
const _initSettings = getSettings();
applyDarkMode(!!_initSettings.darkMode);

// ── State ─────────────────────────────────────────────────────────────────
let expenses = getExpenses();
let settings = getSettings();

// ── Set today's date as default ───────────────────────────────────────────
document.getElementById('inp-date').value = new Date().toISOString().split('T')[0];

// ── Initial render ────────────────────────────────────────────────────────
render();

// ── Add expense ───────────────────────────────────────────────────────────
document.getElementById('add-btn').addEventListener('click', handleAdd);
document.getElementById('inp-amount').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleAdd();
});

function handleAdd() {
  const amtStr = document.getElementById('inp-amount').value.trim();
  const amt    = parseFloat(amtStr);
  const cat    = document.getElementById('inp-category').value;
  const date   = document.getElementById('inp-date').value;
  const note   = document.getElementById('inp-note').value.trim();
  const errEl  = document.getElementById('form-error');

  errEl.style.display = 'none';

  if (!amtStr || isNaN(amt) || amt <= 0) {
    errEl.textContent = 'Please enter a valid amount greater than 0.';
    errEl.style.display = 'block';
    document.getElementById('inp-amount').focus();
    return;
  }
  if (!date) {
    errEl.textContent = 'Please select a date.';
    errEl.style.display = 'block';
    return;
  }

  addExpense({ amount: amt, category: cat, date, note });
  expenses = getExpenses(); // re-read from storage to stay in sync
  document.getElementById('inp-amount').value = '';
  document.getElementById('inp-note').value   = '';
  render();
  showToast('Expense added ✓');
}

// ── Delete (event delegation on list container) ───────────────────────────
document.getElementById('expense-list').addEventListener('click', e => {
  // Show confirm
  const delBtn = e.target.closest('.del-btn');
  if (delBtn) {
    const row = delBtn.closest('.expense-row');
    delBtn.style.display = 'none';
    row.querySelector('.del-actions').classList.add('show');
    return;
  }
  // Cancel
  const cancelBtn = e.target.closest('.cancel-del');
  if (cancelBtn) {
    const row = cancelBtn.closest('.expense-row');
    row.querySelector('.del-btn').style.display = '';
    row.querySelector('.del-actions').classList.remove('show');
    return;
  }
  // Confirm delete
  const confirmBtn = e.target.closest('.confirm-del');
  if (confirmBtn) {
    const id = confirmBtn.dataset.id;
    deleteExpense(id);
    expenses = getExpenses();
    render();
    showToast('Deleted');
  }
});

// ── Master render ─────────────────────────────────────────────────────────
function render() {
  // Always re-read settings so currency/budget changes from settings page are reflected
  settings = getSettings();
  const budget   = parseFloat(settings.budget) || 2000;
  const currency = settings.currency || 'USD';

  // Update currency prefix on the amount input
  const sym = CURRENCY_SYMBOLS[currency] || currency;
  document.getElementById('cur-prefix').textContent = sym;

  const { total, budgetLeft, cats, topCat } = calcStats(expenses, budget);

  // ── Summary cards ──────────────────────────────────────────────────────
  document.getElementById('total-spent').textContent = fmt(total, currency);

  const blEl = document.getElementById('budget-left');
  if (budgetLeft >= 0) {
    blEl.textContent = fmt(budgetLeft, currency);
    blEl.style.color = 'var(--accent-green)';
  } else {
    blEl.textContent = '−' + fmt(Math.abs(budgetLeft), currency);
    blEl.style.color = 'var(--accent-red)';
  }

  document.getElementById('top-category').textContent = topCat
    ? ((CATEGORY_META[topCat]?.icon || '') + ' ' + topCat)
    : '—';

  // ── Budget bar ────────────────────────────────────────────────────────
  const pct = budget > 0 ? Math.min((total / budget) * 100, 100) : 0;
  const bar  = document.getElementById('budget-bar');
  bar.style.width = pct + '%';
  bar.className   = 'progress-fill ' + (pct >= 100 ? 'prog-over' : pct >= 80 ? 'prog-warn' : 'prog-ok');
  document.getElementById('budget-pct').textContent        = Math.round(pct) + '% used';
  document.getElementById('budget-spent-label').textContent = fmt(total, currency) + ' spent';
  document.getElementById('budget-total-label').textContent = 'of ' + fmt(budget, currency);

  // ── Badge ─────────────────────────────────────────────────────────────
  const badge = document.getElementById('track-badge');
  if (pct >= 100) {
    badge.textContent = 'Over Budget';
    badge.className   = 'badge badge-red';
  } else if (pct >= 80) {
    badge.textContent = 'Watch Out';
    badge.className   = 'badge badge-gray';
  } else {
    badge.textContent = 'On Track';
    badge.className   = 'badge badge-green';
  }

  renderList(currency);
  renderChart(cats);
  renderInsights(total, cats, budget, currency);
}

// ── Expense list ──────────────────────────────────────────────────────────
function renderList(currency) {
  const listEl  = document.getElementById('expense-list');
  const emptyEl = document.getElementById('empty-state');
  const countEl = document.getElementById('expense-count');
  countEl.textContent = expenses.length;

  if (!expenses.length) {
    listEl.innerHTML      = '';
    emptyEl.style.display = '';
    return;
  }
  emptyEl.style.display = 'none';

  listEl.innerHTML = expenses.map(exp => {
    const safeNote = escapeHtml(exp.note || '');
    const safeCat  = escapeHtml(exp.category || 'Other');
    return `
      <div class="expense-row" data-id="${exp.id}">
        <span style="font-size:20px;flex-shrink:0;">${exp.icon || '📌'}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;color:var(--text-primary);">${safeCat}</div>
          <div style="display:flex;gap:8px;align-items:center;">
            <span style="font-size:11px;color:var(--text-tertiary);">${formatDate(exp.date)}</span>
            ${safeNote ? `<span class="exp-note" style="font-size:11px;color:var(--text-secondary);">· ${safeNote}</span>` : ''}
          </div>
        </div>
        <span style="font-size:14px;font-weight:700;color:var(--text-primary);flex-shrink:0;">${fmt(exp.amount, currency)}</span>
        <button class="del-btn btn btn-ghost btn-sm" data-id="${exp.id}" title="Delete"
          style="color:var(--accent-red);border-color:transparent;padding:5px 8px;flex-shrink:0;">🗑</button>
        <div class="del-actions" data-id="${exp.id}">
          <button class="confirm-del btn btn-danger btn-sm" data-id="${exp.id}">Delete</button>
          <button class="cancel-del btn btn-ghost btn-sm" data-id="${exp.id}">Cancel</button>
        </div>
      </div>
    `;
  }).join('');
}

// ── Pie chart ─────────────────────────────────────────────────────────────
function renderChart(cats) {
  const svg    = document.getElementById('pie-chart');
  const legend = document.getElementById('chart-legend');
  const empty  = document.getElementById('chart-empty');

  if (!expenses.length || !Object.keys(cats).length) {
    svg.innerHTML    = '';
    legend.innerHTML = '';
    empty.style.display = '';
    svg.style.display   = 'none';
    return;
  }
  empty.style.display = 'none';
  svg.style.display   = '';

  const total   = Object.values(cats).reduce((a, b) => a + b, 0);
  const entries = Object.entries(cats).sort((a, b) => b[1] - a[1]);

  let paths = '';
  let cumAngle = 0;

  entries.forEach(([cat, val]) => {
    const pct   = total > 0 ? val / total : 0;
    const angle = pct * 360;
    const col   = CATEGORY_META[cat]?.color || '#8e8e93';

    if (pct >= 0.9999) {
      // Full circle
      paths += `<circle cx="50" cy="50" r="40" fill="${col}"/>`;
    } else {
      const startRad = ((cumAngle - 90) * Math.PI) / 180;
      const endRad   = ((cumAngle + angle - 90) * Math.PI) / 180;
      const x1 = 50 + 40 * Math.cos(startRad);
      const y1 = 50 + 40 * Math.sin(startRad);
      const x2 = 50 + 40 * Math.cos(endRad);
      const y2 = 50 + 40 * Math.sin(endRad);
      const large = angle > 180 ? 1 : 0;
      paths += `<path d="M50,50 L${x1.toFixed(3)},${y1.toFixed(3)} A40,40 0 ${large},1 ${x2.toFixed(3)},${y2.toFixed(3)} Z" fill="${col}" class="pie-segment"/>`;
    }
    cumAngle += angle;
  });

  // Donut hole
  paths += `<circle cx="50" cy="50" r="22" fill="var(--surface)"/>`;
  paths += `<text x="50" y="47" text-anchor="middle" font-size="7" font-weight="600" fill="var(--text-tertiary)">${entries.length}</text>`;
  paths += `<text x="50" y="56" text-anchor="middle" font-size="6" fill="var(--text-tertiary)">categories</text>`;
  svg.innerHTML = paths;

  legend.innerHTML = entries.map(([cat, val]) => {
    const col = CATEGORY_META[cat]?.color || '#8e8e93';
    const pct = total > 0 ? Math.round((val / total) * 100) : 0;
    return `<span style="display:inline-flex;align-items:center;gap:4px;">
      <span style="width:8px;height:8px;border-radius:50%;background:${col};display:inline-block;flex-shrink:0;"></span>
      ${escapeHtml(cat)} ${pct}%
    </span>`;
  }).join('');
}

// ── Insights ──────────────────────────────────────────────────────────────
function renderInsights(total, cats, budget, currency) {
  const container = document.getElementById('insights-list');
  if (!expenses.length) {
    container.innerHTML = '<p style="font-size:12px;color:var(--text-tertiary);">No insights yet. Start adding expenses.</p>';
    return;
  }

  const entries = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  const items   = [];

  // Dominant category warning
  entries.forEach(([cat, val]) => {
    if (total > 0 && val / total > 0.4) {
      items.push(`⚠️ <strong>${escapeHtml(cat)}</strong> is ${Math.round(val/total*100)}% of your spending.`);
    }
  });

  // Top category
  if (entries.length > 0) {
    items.push(`📊 Biggest spend: <strong>${escapeHtml(entries[0][0])}</strong> — ${fmt(entries[0][1], currency)}.`);
  }

  // Budget status
  if (budget > 0) {
    if (total > budget) {
      items.push(`🔴 You're <strong>${fmt(total - budget, currency)}</strong> over budget!`);
    } else if (total > budget * 0.8) {
      items.push(`💡 ${Math.round(total/budget*100)}% of budget used — getting close.`);
    } else {
      items.push(`✅ ${fmt(budget - total, currency)} remaining of your budget.`);
    }
  }

  // Average expense
  if (expenses.length >= 3) {
    items.push(`📈 Average expense: <strong>${fmt(total / expenses.length, currency)}</strong> over ${expenses.length} entries.`);
  }

  container.innerHTML = items.map(i =>
    `<div style="font-size:12px;line-height:1.65;color:var(--text-primary);padding:4px 0;border-bottom:1px solid var(--border);">${i}</div>`
  ).join('');
}
</script>

</body>
</html>
